<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Я люблю тебя больше всего на свете</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: linear-gradient(-45deg, #ffb6c1, #ff69b4, #ffc0cb, #ff85a2);
    background-size: 400% 400%;
    animation: bgShift 10s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .text {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    text-align: center;
    padding: 0 20px;
    opacity: 0;
    transform: scale(0.5);
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation:
      appear 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards,
      gradientFlow 6s ease infinite 1.8s;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.5));
  }

  @keyframes appear {
    0% {
      opacity: 0;
      transform: scale(0.3) rotate(-5deg);
      filter: blur(10px);
    }
    60% {
      opacity: 1;
      transform: scale(1.1) rotate(2deg);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .kitten-wrap {
    position: fixed;
    top: 8%;
    left: 20%;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: rotate(25deg);
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 1.6s;
  }

  @keyframes kittenAppear {
    0% {
      opacity: 0;
      transform: rotate(25deg) translateY(20px) scale(0.8);
    }
    100% {
      opacity: 1;
      transform: rotate(25deg) translateY(0) scale(1);
    }
  }

  .kitten-frame {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #ff9a5a, #ff6a3d, #ffb347, #ff5f6d);
    background-size: 300% 300%;
    animation:
      borderColorShift 5s linear infinite,
      kittenWiggle 4s ease-in-out infinite;
    box-shadow: 0 0 25px rgba(255, 120, 80, 0.6);
  }

  @keyframes borderColorShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes kittenWiggle {
    0%   { transform: translate(0px, 0px) rotate(0deg); }
    15%  { transform: translate(2px, -1.5px) rotate(1deg); }
    30%  { transform: translate(-1.5px, 2px) rotate(-1deg); }
    45%  { transform: translate(1.5px, 1.5px) rotate(0.5deg); }
    60%  { transform: translate(-2px, -1px) rotate(-0.5deg); }
    75%  { transform: translate(1px, -2px) rotate(1deg); }
    90%  { transform: translate(-1px, 1px) rotate(-0.5deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  .kitten-photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #fff;
  }

  .kitten-caption {
    margin-top: 2px;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-size: 0.8em;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
    animation: gradientFlow 6s ease infinite;
    text-align: center;
  }

  .date-badge {
    position: fixed;
    top: 24px;
    right: 16px;
    transform: rotate(20deg);
    transform-origin: center center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    letter-spacing: 0.5px;
    white-space: nowrap;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
    opacity: 0;
    animation:
      dateAppear 1.5s ease-out forwards,
      gradientFlow 6s ease infinite 1.6s;
    animation-delay: 1.6s, 1.6s;
  }

  @keyframes dateAppear {
    0% {
      opacity: 0;
      transform: rotate(20deg) scale(0.7);
    }
    100% {
      opacity: 1;
      transform: rotate(20deg) scale(1);
    }
  }


  .pop-word {
    position: fixed;
    z-index: 60;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 900;
    font-size: 1.6em;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.35);
    text-shadow:
      0 2px 0 rgba(0,0,0,0.25),
      0 0 14px rgba(255,255,255,0.6);
    pointer-events: none;
    opacity: 0;
    animation: popWord 1.6s ease-out forwards;
  }

  @keyframes popWord {
    0% {
      opacity: 0;
      transform: scale(0.3) rotate(-10deg);
    }
    25% {
      opacity: 1;
      transform: scale(1.2) rotate(5deg);
    }
    45% {
      transform: scale(1) rotate(0deg);
    }
    80% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    100% {
      opacity: 0;
      transform: scale(0.9) translateY(-20px);
    }
  }

  .popup-gif {
    position: fixed;
    bottom: -300px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    max-width: 60vw;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 50;
    pointer-events: none;
  }

  .popup-gif.show {
    animation: popupGif 2.7s ease-out forwards;
  }

  @keyframes popupGif {
    0% {
      bottom: -300px;
      opacity: 0;
    }
    16% {
      bottom: 30px;
      opacity: 1;
    }
    80% {
      bottom: 30px;
      opacity: 1;
    }
    100% {
      bottom: -300px;
      opacity: 0;
    }
  }

  .heart-chip {
    position: fixed;
    width: 56px;
    height: 56px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 45;
    opacity: 0;
    animation: kittenAppear 1.2s ease-out forwards;
  }

  .heart-chip .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px var(--heart-shadow, rgba(41, 121, 255, 0.5)));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-chip .heart-shape path {
    fill: var(--heart-fill, #2979ff);
  }

  .heart-chip:active .heart-shape {
    transform: scale(0.85);
  }

  .heart-chip span {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.85em;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    margin-top: -14px;
    transition: opacity 0.3s ease;
  }

  .heart-message {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20% 22% 46%;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(0.95rem, 4vw, 1.2rem);
    line-height: 1.4;
    letter-spacing: 0.2px;
    background: linear-gradient(120deg, #ffffff, #ffe1ec, #ffd6e8, #ffffff);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
    transition: opacity 0.5s ease 0.35s, transform 0.5s ease 0.35s;
  }

  .heart-chip.expanded .heart-message {
    opacity: 1;
    transform: scale(1);
    animation: gradientFlow 4s ease infinite;
  }

  .heart-message-sub {
    display: block;
    font-weight: 900;
    font-style: normal;
    font-size: 1.35em;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff6a9, #ffd166, #ff9a5a, #ffd166, #fff6a9);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.4));
    animation: gradientFlow 3s ease infinite;
  }

  .heart-chip {
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .heart-chip.vanish {
    opacity: 0;
    transform: scale(0.3);
    pointer-events: none;
  }

  .heart-chip.expanded {
    width: 260px;
    height: 260px;
    z-index: 80;
    transition: width 1.4s cubic-bezier(0.34, 1.2, 0.64, 1), height 1.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .heart-chip.expanded .heart-shape {
    animation: none;
    transform: none !important;
  }

  .heart-chip.expanded .default-label {
    opacity: 0;
  }

  .heart-chip.expanded .heart-message {
    opacity: 1;
  }

  body.fx-active .page,
  body.fx-active .date-badge,
  body.fx-active #chainHeart {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .flash-word {
    position: fixed;
    z-index: 70;
    font-weight: 900;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    color: #ffffff;
    text-shadow:
      0 0 12px rgba(255,255,255,0.95),
      0 0 30px rgba(255, 182, 220, 0.9),
      0 0 50px rgba(255, 105, 180, 0.7);
    pointer-events: none;
    opacity: 0;
    animation: flashPop 0.6s ease-out forwards;
  }

  @keyframes flashPop {
    0% {
      opacity: 0;
      transform: scale(0.2) rotate(-8deg);
    }
    30% {
      opacity: 1;
      transform: scale(1.3) rotate(4deg);
    }
    55% {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: scale(1.05);
    }
  }

  .heart-orange {
    position: relative;
    width: 64px;
    height: 64px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    opacity: 0;
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 1.2s;
  }

  .heart-orange .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px rgba(255, 140, 0, 0.55));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-orange:active .heart-shape {
    transform: scale(0.85);
  }

  .fx-background {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 105, 180, 0.22), transparent 42%),
      linear-gradient(135deg, #17171d 0%, #2b2b30 45%, #15151a 100%);
    transition: opacity 2.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body.fx-active .fx-background {
    opacity: 1;
  }

  .pink-sweep {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(255, 105, 180, 0.55) 20%,
      rgba(255, 20, 147, 0.65) 35%,
      rgba(255, 182, 193, 0.5) 50%,
      transparent 65%
    );
    background-size: 250% 100%;
    background-position: -150% 0;
    opacity: 0;
  }

  .pink-sweep.active {
    animation: sweepMove 12s ease-in-out forwards;
  }

  @keyframes sweepMove {
    0%   { background-position: -150% 0; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { background-position: 150% 0; opacity: 0; }
  }

  .leaf {
    position: fixed;
    left: -8%;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    animation: leafBlow linear forwards;
  }

  @keyframes leafBlow {
    0% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    50% {
      transform: translate(55vw, -35px) rotate(180deg);
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translate(120vw, 25px) rotate(360deg);
      opacity: 0;
    }
  }

  .heart-btn {
    position: relative;
    margin-top: 26px;
    width: 76px;
    height: 76px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 2.2s;
  }

  .heart-btn .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px rgba(255, 60, 100, 0.5));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-btn:active .heart-shape {
    transform: scale(0.85);
  }

  .heart-btn span {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-weight: 800;
    font-size: 1em;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    margin-top: -14px;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.1); }
    30% { transform: scale(0.97); }
    45% { transform: scale(1.06); }
    60% { transform: scale(1); }
  }

  .heart {
    position: fixed;
    bottom: -10%;
    font-size: 24px;
    opacity: 0.8;
    animation: float linear infinite;
  }

  @keyframes float {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.9;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }  /* ===== Мини-игра "Собери сердце" ===== */

  .heart-purple {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    opacity: 0;
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 1.4s;
  }

  .heart-purple .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px rgba(142, 45, 226, 0.55));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-purple:active .heart-shape {
    transform: scale(0.85);
  }

  .hg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 10, 20, 0.72);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .hg-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .hg-panel {
    background: linear-gradient(160deg, #2e2a3a, #1c1a24);
    border-radius: 26px;
    padding: 28px 22px;
    width: min(92vw, 420px);
    max-height: 88vh;
    overflow: auto;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 0 40px rgba(255, 105, 180, 0.15);
    position: relative;
    text-align: center;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .hg-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    padding: 1.5px;
    background: linear-gradient(135deg, #ff5f6d, #a663ff, #4cc9f0, #ffd166, #ff5f6d);
    background-size: 300% 300%;
    animation: gradientFlow 6s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .hg-panel.hg-hidden {
    display: none;
  }

  .hg-panel.hg-leaving {
    opacity: 0;
    transform: scale(0.92);
  }

  .hg-title {
    position: relative;
    color: #ffffff;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-size: 1.1em;
    margin-bottom: 6px;
    line-height: 1.4;
    background: linear-gradient(90deg, #fff, #ffd6e8, #fff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: gradientFlow 4s ease infinite;
  }

  .hg-subtitle {
    color: rgba(255,255,255,0.55);
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-size: 0.75em;
    margin-bottom: 18px;
  }

  .hg-progress-wrap {
    position: relative;
    width: 100%;
    max-width: 260px;
    margin: 0 auto 18px;
  }

  .hg-progress-track {
    width: 100%;
    height: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
  }

  .hg-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff5f6d, #ffd166, #06d6a0);
    transition: width 0.4s ease;
  }

  .hg-progress-label {
    margin-top: 6px;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-size: 0.72em;
    color: rgba(255,255,255,0.6);
  }

  .hg-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    justify-items: center;
  }

  .hg-heart-pick {
    width: 52px;
    height: 52px;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
  }

  .hg-heart-pick svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45));
    transition: transform 0.2s ease;
  }

  .hg-heart-pick:hover svg {
    transform: scale(1.12);
  }

  .hg-heart-pick.wrong svg {
    animation: hgShake 0.4s ease;
  }

  @keyframes hgShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .hg-puzzle-area {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 320px;
    margin: 0 auto;
    background: radial-gradient(circle at 50% 40%, rgba(255,105,180,0.12), rgba(255,255,255,0.02) 70%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: visible;
    touch-action: none;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35);
  }

  .hg-heart-outline {
    position: absolute;
    inset: 4%;
    width: 92%;
    height: 92%;
    opacity: 0.55;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(255,150,200,0.5));
    animation: hgOutlinePulse 2.4s ease-in-out infinite;
  }

  @keyframes hgOutlinePulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.65; }
  }

  .hg-slot {
    position: absolute;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    pointer-events: none;
    animation: hgSlotPulse 2s ease-in-out infinite;
  }

  .hg-slot svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hg-slot path {
    fill: none;
    stroke: rgba(255,255,255,0.5);
    stroke-width: 3;
    stroke-dasharray: 6 5;
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  @keyframes hgSlotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .hg-slot.filled {
    animation: none;
  }

  .hg-slot.filled path {
    stroke: rgba(120, 255, 180, 0.9);
    stroke-dasharray: none;
    filter: drop-shadow(0 0 8px rgba(120, 255, 180, 0.6));
  }

  .hg-piece {
    position: absolute;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    margin-top: -16px;
    cursor: grab;
    touch-action: none;
    z-index: 2;
  }

  .hg-piece.placed {
    cursor: default;
    z-index: 1;
    animation: heartBeat 1.6s ease-in-out infinite;
  }

  .hg-piece.dragging {
    z-index: 10;
    cursor: grabbing;
  }

  .hg-piece svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  .hg-close {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .hg-wrong-flash {
    animation: hgWrongFlash 1.1s ease;
  }

  @keyframes hgWrongFlash {
    0%, 100% { color: transparent; }
    20%, 60% { -webkit-text-fill-color: #ff5f6d; color: #ff5f6d; }
  }

  .hg-slot-center path {
    stroke-width: 3.4;
  }

  .hg-hint {
    color: rgba(255,255,255,0.6);
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-size: 0.75em;
    margin-top: 14px;
  }

  .finale-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(255,182,220,0.35), rgba(20,10,25,0.85));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  .finale-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .finale-text {
    max-width: 85vw;
    text-align: center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(1.3rem, 5.5vw, 2.1rem);
    line-height: 1.5;
    background: linear-gradient(120deg, #ffffff, #ffe1ec, #ffd6e8, #fff6a9, #ffffff);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    animation: gradientFlow 5s ease infinite;
  }

  .finale-overlay.active .finale-text {
    opacity: 1;
    transform: scale(1);
  }

  .finale-close {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 26px;
    border-radius: 30px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 700;
    font-size: 0.85em;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.8s ease 0.6s;
  }

  .finale-overlay.active .finale-close {
    opacity: 1;
  }

</style>
</head>
<body>

  <div class="date-badge">03.09.2026 💖</div>

  <button id="chainHeart" class="heart-chip" style="top: 90px; right: 70px; --heart-fill: #2979ff; --heart-shadow: rgba(41, 121, 255, 0.5);" onclick="heartStage2()">
    <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z"/>
    </svg>
    <span class="default-label">жми</span>
    <div class="heart-message">
      я хочу, чтобы ты это запомнила, зайчик
      <span class="heart-message-sub">ты моё всё</span>
    </div>
  </button>

  <div class="page">
    <button class="heart-orange" onclick="triggerBreeze()">
      <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="orangeHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb703"/>
            <stop offset="50%" stop-color="#ff9a3d"/>
            <stop offset="100%" stop-color="#ff7b00"/>
          </linearGradient>
        </defs>
        <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z" fill="url(#orangeHeartGrad)"/>
      </svg>
    </button>

    <div class="text">Я ЛЮБЛЮ ТЕБЯ<br>БОЛЬШЕ ВСЕГО НА СВЕТЕ</div>

    <div class="kitten-wrap">
      <div class="kitten-frame">
        <img class="kitten-photo" src="https://raw.githubusercontent.com/LowSkill228/forYou/main/kitten.jpeg" alt="котёнок">
      </div>
      <div class="kitten-caption">ты самый лучший котенок</div>
    </div>

    <button class="heart-btn" onclick="showPopupGif()">
      <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="pinkHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5f6d"/>
            <stop offset="50%" stop-color="#ff85a2"/>
            <stop offset="100%" stop-color="#ff3d68"/>
          </linearGradient>
        </defs>
        <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z" fill="url(#pinkHeartGrad)"/>
      </svg>
      <span>жмак</span>
    </button>
  </div>

  <img id="popupGif" class="popup-gif" src="https://media1.tenor.com/m/Yp0KOBZZ9RYAAAAC/%D0%BA%D0%BE%D1%82-%D0%BF%D0%BE%D1%86%D0%B5%D0%BB%D1%83%D0%B9.gif" alt="котик">

  <div class="fx-background"></div>
  <div id="pinkSweep" class="pink-sweep"></div>

  <button class="heart-purple" onclick="openHeartGame()">
    <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="purpleHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a663ff"/>
          <stop offset="50%" stop-color="#8e2de2"/>
          <stop offset="100%" stop-color="#4a00e0"/>
        </linearGradient>
      </defs>
      <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z" fill="url(#purpleHeartGrad)"/>
    </svg>
  </button>

  <div id="hgOverlay" class="hg-overlay">
    <div class="hg-panel" id="hgSelectPanel">
      <button class="hg-close" onclick="closeHeartGame()">✕</button>
      <div class="hg-title">Выбери одно сердце...</div>
      <div class="hg-subtitle">только одно из них настоящее 🖤</div>
      <div class="hg-grid" id="hgGrid"></div>
    </div>

    <div class="hg-panel hg-hidden" id="hgPuzzlePanel">
      <button class="hg-close" onclick="closeHeartGame()">✕</button>
      <div class="hg-title" id="hgPuzzleTitle">Собери осколки в сердце</div>
      <div class="hg-subtitle">перетаскивай сердечки в пунктирные точки</div>
      <div class="hg-progress-wrap">
        <div class="hg-progress-track">
          <div class="hg-progress-fill" id="hgProgressFill"></div>
        </div>
        <div class="hg-progress-label" id="hgProgressLabel">собрано 0 из 12</div>
      </div>
      <div class="hg-puzzle-area" id="hgPuzzleArea">
        <svg class="hg-heart-outline" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="hgOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff9fc7"/>
              <stop offset="50%" stop-color="#ffd1e8"/>
              <stop offset="100%" stop-color="#c9a7ff"/>
            </linearGradient>
          </defs>
          <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z" fill="none" stroke="url(#hgOutlineGrad)" stroke-width="2.2"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="finaleOverlay" class="finale-overlay">
    <div class="finale-text" id="finaleText"></div>
    <button class="finale-close" onclick="closeFinale()">закрыть 💗</button>
  </div>

<script>
  const hearts = ['❤','💕','💖','💗','💓','💞'];
  function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random()*100 + 'vw';
    const duration = 6 + Math.random()*6;
    h.style.animationDuration = duration + 's';
    h.style.fontSize = (16 + Math.random()*24) + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), duration*1000);
  }
  setInterval(createHeart, 400);

  function showPopupGif() {
    const gif = document.getElementById('popupGif');
    gif.classList.remove('show');
    void gif.offsetWidth; // force reflow to restart animation
    gif.classList.add('show');
    spawnPopWords();
  }

  function spawnPopWords() {
    const count = 5 + Math.floor(Math.random() * 2); // 5-6 слов
    const colors = ['#0033ff', '#00c2ff', '#00e676', '#ffea00', '#ff6d00', '#8e00ff', '#00ffd5', '#ffffff'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const word = document.createElement('div');
        word.className = 'pop-word';
        word.textContent = 'цём';
        word.style.left = (10 + Math.random() * 75) + 'vw';
        word.style.top = (15 + Math.random() * 60) + 'vh';
        word.style.fontSize = (1.2 + Math.random() * 0.9) + 'em';
        word.style.color = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(word);
        setTimeout(() => word.remove(), 1700);
      }, i * 150);
    }
  }  function heartStage2() {
    const btn = document.getElementById('chainHeart');
    btn.style.top = '';
    btn.style.right = '';
    btn.style.bottom = '30%';
    btn.style.left = '12%';
    btn.style.setProperty('--heart-fill', '#ffcc00');
    btn.style.setProperty('--heart-shadow', 'rgba(255, 190, 0, 0.55)');
    btn.setAttribute('onclick', 'heartStage3()');
  }

  function heartStage3() {
    const btn = document.getElementById('chainHeart');
    const left = 40 + Math.random() * 20; // 40-60% ближе к центру
    const top = 35 + Math.random() * 20;  // 35-55% ближе к центру
    btn.style.bottom = '';
    btn.style.right = '';
    btn.style.left = left + 'vw';
    btn.style.top = top + 'vh';
    btn.style.setProperty('--heart-fill', '#ff0022');
    btn.style.setProperty('--heart-shadow', 'rgba(255, 0, 40, 0.55)');
    btn.setAttribute('onclick', 'heartStage4()');
  }

  function heartStage4() {
    const btn = document.getElementById('chainHeart');
    btn.removeAttribute('onclick');
    btn.classList.add('expanded');
    setTimeout(() => {
      btn.classList.remove('expanded');
      btn.classList.add('vanish');
      setTimeout(() => btn.remove(), 600);
    }, 5000);
  }

  function triggerBreeze() {
    const sweep = document.getElementById('pinkSweep');
    sweep.classList.remove('active');
    void sweep.offsetWidth;
    sweep.classList.add('active');

    document.body.classList.add('fx-active');
    document.documentElement.style.animation = 'none';
    document.body.style.animation = 'none';

    spawnLeaves();
    spawnFlashWords();

    setTimeout(() => {
      document.body.classList.remove('fx-active');
      document.documentElement.style.animation = '';
      document.body.style.animation = '';
    }, 17000);
  }

  function spawnFlashWords() {
    const words = ['любимая', 'люблю', 'котик', 'солнышко', 'красотка', 'удивительная', 'невероятная'];
    const colors = ['#ff6fa5', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#c77dff', '#ffa62b', '#ff5d8f'];
    const count = 34;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'flash-word';
        el.textContent = words[Math.floor(Math.random() * words.length)];
        el.style.left = (8 + Math.random() * 74) + 'vw';
        el.style.top = (10 + Math.random() * 70) + 'vh';
        el.style.fontSize = (1.4 + Math.random() * 1) + 'em';
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 650);
      }, i * 390);
    }
  }

  function spawnLeaves() {
    const emojis = ['🍃', '🍂', '🍁'];
    const count = 80;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        leaf.style.top = (Math.random() * 90) + 'vh';
        const duration = 3 + Math.random() * 2;
        leaf.style.animationDuration = duration + 's';
        leaf.style.fontSize = (18 + Math.random() * 14) + 'px';
        document.body.appendChild(leaf);
        setTimeout(() => leaf.remove(), duration * 1000);
      }, i * 180);
    }
  }
  /* ===== Мини-игра "Собери сердце" ===== */

  const HEART_PATH_D = "M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z";

  const HG_COLORS = [
    '#ff5f6d', '#ffb703', '#06d6a0', '#4cc9f0',
    '#c77dff', '#f72585', '#ff9a3d', '#2979ff',
    '#e63946', '#8ac926', '#ffd166', '#000000'
  ];

  // 11 точек по контуру сердца + 1 центральная (обязательно для чёрного сердца)
  const HG_OUTLINE_SLOTS = [
    { x: 66, y: 6 },
    { x: 84, y: 14 },
    { x: 93, y: 32 },
    { x: 87, y: 50 },
    { x: 73, y: 66 },
    { x: 50, y: 90 },
    { x: 27, y: 66 },
    { x: 13, y: 50 },
    { x: 7,  y: 32 },
    { x: 16, y: 14 },
    { x: 34, y: 6 }
  ];
  const HG_CENTER_SLOT = { x: 50, y: 50 };
  const HG_SLOTS = [...HG_OUTLINE_SLOTS, { ...HG_CENTER_SLOT, center: true }];

  const FINALE_MESSAGES = [
    "Ты — самое тёплое, что есть в моей жизни 💗",
    "Рядом с тобой даже обычный день становится особенным",
    "Ты моё самое любимое чудо на свете 🌸",
    "Спасибо, что ты просто есть — этого достаточно, чтобы я улыбался"
  ];

  let hgFilledCount = 0;

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function heartSvg(color) {
    return `<svg viewBox="0 0 100 100"><path d="${HEART_PATH_D}" fill="${color}"/></svg>`;
  }

  function openHeartGame() {
    document.getElementById('hgOverlay').classList.add('active');
    document.getElementById('hgSelectPanel').classList.remove('hg-hidden', 'hg-leaving');
    document.getElementById('hgPuzzlePanel').classList.add('hg-hidden');
    buildSelectGrid();
  }

  function closeHeartGame() {
    document.getElementById('hgOverlay').classList.remove('active');
  }

  function buildSelectGrid() {
    const grid = document.getElementById('hgGrid');
    grid.innerHTML = '';
    const colors = shuffleArray(HG_COLORS);
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'hg-heart-pick';
      btn.innerHTML = heartSvg(color);
      btn.onclick = () => selectHeart(color, btn);
      grid.appendChild(btn);
    });
  }

  function selectHeart(color, btnEl) {
    if (color === '#000000') {
      transitionToPuzzle();
    } else {
      btnEl.classList.remove('wrong');
      void btnEl.offsetWidth;
      btnEl.classList.add('wrong');
    }
  }

  function transitionToPuzzle() {
    const selectPanel = document.getElementById('hgSelectPanel');
    selectPanel.classList.add('hg-leaving');
    setTimeout(() => {
      selectPanel.classList.add('hg-hidden');
      document.getElementById('hgPuzzlePanel').classList.remove('hg-hidden');
      buildPuzzle();
    }, 400);
  }

  function buildPuzzle() {
    const area = document.getElementById('hgPuzzleArea');
    area.querySelectorAll('.hg-slot, .hg-piece').forEach(el => el.remove());
    hgFilledCount = 0;
    updateHgProgress();

    HG_SLOTS.forEach(slot => {
      const s = document.createElement('div');
      s.className = 'hg-slot' + (slot.center ? ' hg-slot-center' : '');
      s.style.left = slot.x + '%';
      s.style.top = slot.y + '%';
      s.dataset.x = slot.x;
      s.dataset.y = slot.y;
      s.dataset.center = slot.center ? 'true' : 'false';
      s.innerHTML = `<svg viewBox="0 0 100 100"><path d="${HEART_PATH_D}"/></svg>`;
      area.appendChild(s);
    });

    const colors = shuffleArray(HG_COLORS);
    colors.forEach((color, i) => {
      const piece = document.createElement('div');
      piece.className = 'hg-piece';
      piece.dataset.color = color;
      piece.innerHTML = heartSvg(color);
      const rx = 8 + Math.random() * 84;
      const ry = 8 + Math.random() * 84;
      piece.style.left = rx + '%';
      piece.style.top = ry + '%';
      area.appendChild(piece);
      makeDraggable(piece, area);
    });
  }

  function makeDraggable(piece, area) {
    let dragging = false;
    let offsetX = 0, offsetY = 0;

    piece.addEventListener('pointerdown', (e) => {
      if (piece.classList.contains('placed')) return;
      dragging = true;
      piece.classList.add('dragging');
      piece.setPointerCapture(e.pointerId);
      const rect = area.getBoundingClientRect();
      const pieceRect = piece.getBoundingClientRect();
      offsetX = e.clientX - (pieceRect.left + pieceRect.width / 2);
      offsetY = e.clientY - (pieceRect.top + pieceRect.height / 2);
    });

    piece.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = area.getBoundingClientRect();
      let px = ((e.clientX - offsetX - rect.left) / rect.width) * 100;
      let py = ((e.clientY - offsetY - rect.top) / rect.height) * 100;
      px = Math.max(0, Math.min(100, px));
      py = Math.max(0, Math.min(100, py));
      piece.style.left = px + '%';
      piece.style.top = py + '%';
    });

    piece.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      piece.classList.remove('dragging');
      snapToSlot(piece, area);
    });
  }

  function snapToSlot(piece, area) {
    const px = parseFloat(piece.style.left);
    const py = parseFloat(piece.style.top);
    let closestSlot = null;
    let closestDist = Infinity;

    area.querySelectorAll('.hg-slot').forEach(slot => {
      if (slot.classList.contains('filled')) return;
      const sx = parseFloat(slot.dataset.x);
      const sy = parseFloat(slot.dataset.y);
      const dist = Math.hypot(px - sx, py - sy);
      if (dist < closestDist) {
        closestDist = dist;
        closestSlot = slot;
      }
    });

    if (closestSlot && closestDist < 9) {
      piece.style.left = closestSlot.dataset.x + '%';
      piece.style.top = closestSlot.dataset.y + '%';
      piece.classList.add('placed');
      closestSlot.classList.add('filled');
      closestSlot.dataset.filledColor = piece.dataset.color;
      hgFilledCount++;
      updateHgProgress();
      if (hgFilledCount >= HG_SLOTS.length) {
        setTimeout(checkPuzzleResult, 500);
      }
    }
  }

  function checkPuzzleResult() {
    const area = document.getElementById('hgPuzzleArea');
    const centerSlot = area.querySelector('.hg-slot[data-center="true"]');
    const isCorrect = centerSlot && centerSlot.dataset.filledColor === '#000000';

    if (isCorrect) {
      showFinale();
    } else {
      const title = document.getElementById('hgPuzzleTitle');
      if (title) {
        title.textContent = 'не то... пробуй ещё раз';
        title.classList.remove('hg-wrong-flash');
        void title.offsetWidth;
        title.classList.add('hg-wrong-flash');
      }
      setTimeout(() => {
        if (title) title.textContent = 'Собери осколки в сердце';
        buildPuzzle();
      }, 1100);
    }
  }

  function updateHgProgress() {
    const fill = document.getElementById('hgProgressFill');
    const label = document.getElementById('hgProgressLabel');
    if (fill) fill.style.width = (hgFilledCount / HG_SLOTS.length * 100) + '%';
    if (label) label.textContent = `собрано ${hgFilledCount} из ${HG_SLOTS.length}`;
  }

  function showFinale() {
    closeHeartGame();
    const message = FINALE_MESSAGES[Math.floor(Math.random() * FINALE_MESSAGES.length)];
    document.getElementById('finaleText').textContent = message;
    document.getElementById('finaleOverlay').classList.add('active');
  }

  function closeFinale() {
    document.getElementById('finaleOverlay').classList.remove('active');
  }
</script>

</body>
