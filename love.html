<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Я люблю тебя больше всего на свете</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: linear-gradient(-45deg, #ffb6c1, #ff69b4, #ffc0cb, #ff85a2);
    background-size: 400% 400%;
    animation: bgShift 10s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .text {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    text-align: center;
    padding: 0 20px;
    opacity: 0;
    transform: scale(0.5);
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation:
      appear 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards,
      gradientFlow 6s ease infinite 1.8s;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.5));
  }

  @keyframes appear {
    0% {
      opacity: 0;
      transform: scale(0.3) rotate(-5deg);
      filter: blur(10px);
    }
    60% {
      opacity: 1;
      transform: scale(1.1) rotate(2deg);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .kitten-wrap {
    position: fixed;
    top: 8%;
    left: 20%;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: rotate(25deg);
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 1.6s;
  }

  @keyframes kittenAppear {
    0% {
      opacity: 0;
      transform: rotate(25deg) translateY(20px) scale(0.8);
    }
    100% {
      opacity: 1;
      transform: rotate(25deg) translateY(0) scale(1);
    }
  }

  .kitten-frame {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #ff9a5a, #ff6a3d, #ffb347, #ff5f6d);
    background-size: 300% 300%;
    animation:
      borderColorShift 5s linear infinite,
      kittenWiggle 4s ease-in-out infinite;
    box-shadow: 0 0 25px rgba(255, 120, 80, 0.6);
  }

  @keyframes borderColorShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes kittenWiggle {
    0%   { transform: translate(0px, 0px) rotate(0deg); }
    15%  { transform: translate(2px, -1.5px) rotate(1deg); }
    30%  { transform: translate(-1.5px, 2px) rotate(-1deg); }
    45%  { transform: translate(1.5px, 1.5px) rotate(0.5deg); }
    60%  { transform: translate(-2px, -1px) rotate(-0.5deg); }
    75%  { transform: translate(1px, -2px) rotate(1deg); }
    90%  { transform: translate(-1px, 1px) rotate(-0.5deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  .kitten-photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #fff;
  }

  .kitten-caption {
    margin-top: 2px;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-size: 0.8em;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
    animation: gradientFlow 6s ease infinite;
    text-align: center;
  }

  .date-badge {
    position: fixed;
    top: 24px;
    right: 16px;
    transform: rotate(20deg);
    transform-origin: center center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    letter-spacing: 0.5px;
    white-space: nowrap;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #ff9a9e, #a18cd1, #fbc2eb, #ff5f6d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
    opacity: 0;
    animation:
      dateAppear 1.5s ease-out forwards,
      gradientFlow 6s ease infinite 1.6s;
    animation-delay: 1.6s, 1.6s;
  }

  @keyframes dateAppear {
    0% {
      opacity: 0;
      transform: rotate(20deg) scale(0.7);
    }
    100% {
      opacity: 1;
      transform: rotate(20deg) scale(1);
    }
  }


  .pop-word {
    position: fixed;
    z-index: 60;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 900;
    font-size: 1.6em;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.35);
    text-shadow:
      0 2px 0 rgba(0,0,0,0.25),
      0 0 14px rgba(255,255,255,0.6);
    pointer-events: none;
    opacity: 0;
    animation: popWord 1.6s ease-out forwards;
  }

  @keyframes popWord {
    0% {
      opacity: 0;
      transform: scale(0.3) rotate(-10deg);
    }
    25% {
      opacity: 1;
      transform: scale(1.2) rotate(5deg);
    }
    45% {
      transform: scale(1) rotate(0deg);
    }
    80% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    100% {
      opacity: 0;
      transform: scale(0.9) translateY(-20px);
    }
  }

  .popup-gif {
    position: fixed;
    bottom: -300px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    max-width: 60vw;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 50;
    pointer-events: none;
  }

  .popup-gif.show {
    animation: popupGif 2.7s ease-out forwards;
  }

  @keyframes popupGif {
    0% {
      bottom: -300px;
      opacity: 0;
    }
    16% {
      bottom: 30px;
      opacity: 1;
    }
    80% {
      bottom: 30px;
      opacity: 1;
    }
    100% {
      bottom: -300px;
      opacity: 0;
    }
  }

  .heart-chip {
    position: fixed;
    width: 56px;
    height: 56px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 45;
    opacity: 0;
    animation: kittenAppear 1.2s ease-out forwards;
  }

  .heart-chip .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px var(--heart-shadow, rgba(41, 121, 255, 0.5)));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-chip .heart-shape path {
    fill: var(--heart-fill, #2979ff);
  }

  .heart-chip:active .heart-shape {
    transform: scale(0.85);
  }

  .heart-chip span {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.85em;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    margin-top: -14px;
    transition: opacity 0.3s ease;
  }

  .heart-message {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20% 22% 46%;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(0.95rem, 4vw, 1.2rem);
    line-height: 1.4;
    letter-spacing: 0.2px;
    background: linear-gradient(120deg, #ffffff, #ffe1ec, #ffd6e8, #ffffff);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
    transition: opacity 0.5s ease 0.35s, transform 0.5s ease 0.35s;
  }

  .heart-chip.expanded .heart-message {
    opacity: 1;
    transform: scale(1);
    animation: gradientFlow 4s ease infinite;
  }

  .heart-chip {
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .heart-chip.vanish {
    opacity: 0;
    transform: scale(0.3);
    pointer-events: none;
  }

  .heart-chip.expanded {
    width: 260px;
    height: 260px;
    z-index: 80;
    transition: width 1.4s cubic-bezier(0.34, 1.2, 0.64, 1), height 1.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .heart-chip.expanded .heart-shape {
    animation: none;
    transform: none !important;
  }

  .heart-chip.expanded .default-label {
    opacity: 0;
  }

  .heart-chip.expanded .heart-message {
    opacity: 1;
  }

  .heart-btn {
    position: relative;
    margin-top: 26px;
    width: 76px;
    height: 76px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: kittenAppear 1.5s ease-out forwards;
    animation-delay: 2.2s;
  }

  .heart-btn .heart-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px rgba(255, 60, 100, 0.5));
    animation: heartBeat 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .heart-btn:active .heart-shape {
    transform: scale(0.85);
  }

  .heart-btn span {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-weight: 800;
    font-size: 1em;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    margin-top: -14px;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.1); }
    30% { transform: scale(0.97); }
    45% { transform: scale(1.06); }
    60% { transform: scale(1); }
  }

  .heart {
    position: fixed;
    bottom: -10%;
    font-size: 24px;
    opacity: 0.8;
    animation: float linear infinite;
  }

  @keyframes float {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.9;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <div class="date-badge">03.09.2026 💖</div>

  <button id="chainHeart" class="heart-chip" style="top: 90px; right: 70px; --heart-fill: #2979ff; --heart-shadow: rgba(41, 121, 255, 0.5);" onclick="heartStage2()">
    <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z"/>
    </svg>
    <span class="default-label">жми</span>
    <div class="heart-message">
      я хочу, чтобы ты это запомнила, зайчик
      <span class="heart-message-sub">ты моё всё</span>
    </div>
  </button>

  <div class="page">
    <div class="text">Я ЛЮБЛЮ ТЕБЯ<br>БОЛЬШЕ ВСЕГО НА СВЕТЕ</div>

    <div class="kitten-wrap">
      <div class="kitten-frame">
        <img class="kitten-photo" src="https://raw.githubusercontent.com/LowSkill228/forYou/main/kitten.jpeg" alt="котёнок">
      </div>
      <div class="kitten-caption">ты самый лучший котенок</div>
    </div>

    <button class="heart-btn" onclick="showPopupGif()">
      <svg class="heart-shape" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="pinkHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5f6d"/>
            <stop offset="50%" stop-color="#ff85a2"/>
            <stop offset="100%" stop-color="#ff3d68"/>
          </linearGradient>
        </defs>
        <path d="M50 88 C50 88 8 55 8 30 C8 14 20 3 34 3 C42 3 49 8 50 18 C51 8 58 3 66 3 C80 3 92 14 92 30 C92 55 50 88 50 88 Z" fill="url(#pinkHeartGrad)"/>
      </svg>
      <span>жмак</span>
    </button>
  </div>

  <img id="popupGif" class="popup-gif" src="https://media1.tenor.com/m/Yp0KOBZZ9RYAAAAC/%D0%BA%D0%BE%D1%82-%D0%BF%D0%BE%D1%86%D0%B5%D0%BB%D1%83%D0%B9.gif" alt="котик">

<script>
  const hearts = ['❤','💕','💖','💗','💓','💞'];
  function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random()*100 + 'vw';
    const duration = 6 + Math.random()*6;
    h.style.animationDuration = duration + 's';
    h.style.fontSize = (16 + Math.random()*24) + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), duration*1000);
  }
  setInterval(createHeart, 400);

  function showPopupGif() {
    const gif = document.getElementById('popupGif');
    gif.classList.remove('show');
    void gif.offsetWidth; // force reflow to restart animation
    gif.classList.add('show');
    spawnPopWords();
  }

  function spawnPopWords() {
    const count = 5 + Math.floor(Math.random() * 2); // 5-6 слов
    const colors = ['#0033ff', '#00c2ff', '#00e676', '#ffea00', '#ff6d00', '#8e00ff', '#00ffd5', '#ffffff'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const word = document.createElement('div');
        word.className = 'pop-word';
        word.textContent = 'цём';
        word.style.left = (10 + Math.random() * 75) + 'vw';
        word.style.top = (15 + Math.random() * 60) + 'vh';
        word.style.fontSize = (1.2 + Math.random() * 0.9) + 'em';
        word.style.color = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(word);
        setTimeout(() => word.remove(), 1700);
      }, i * 150);
    }
  }  function heartStage2() {
    const btn = document.getElementById('chainHeart');
    btn.style.top = '';
    btn.style.right = '';
    btn.style.bottom = '30%';
    btn.style.left = '12%';
    btn.style.setProperty('--heart-fill', '#ffcc00');
    btn.style.setProperty('--heart-shadow', 'rgba(255, 190, 0, 0.55)');
    btn.setAttribute('onclick', 'heartStage3()');
  }

  function heartStage3() {
    const btn = document.getElementById('chainHeart');
    const left = 40 + Math.random() * 20; // 40-60% ближе к центру
    const top = 35 + Math.random() * 20;  // 35-55% ближе к центру
    btn.style.bottom = '';
    btn.style.right = '';
    btn.style.left = left + 'vw';
    btn.style.top = top + 'vh';
    btn.style.setProperty('--heart-fill', '#ff0022');
    btn.style.setProperty('--heart-shadow', 'rgba(255, 0, 40, 0.55)');
    btn.setAttribute('onclick', 'heartStage4()');
  }

  function heartStage4() {
    const btn = document.getElementById('chainHeart');
    btn.removeAttribute('onclick');
    btn.classList.add('expanded');
    setTimeout(() => {
      btn.classList.remove('expanded');
      btn.classList.add('vanish');
      setTimeout(() => btn.remove(), 600);
    }, 5000);
  }
</script>

</body>
</html>
